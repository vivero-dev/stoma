name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: write

jobs:
  # Gate: smoke tests must pass on all platforms before publishing
  e2e-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'changeset-release/main')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build

      - name: E2E smoke test CLI
        run: pnpm --filter @vivero/stoma-cli test:e2e:smoke

  publish:
    needs: e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm changeset:publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: stoma-dist
          path: |
            packages/gateway/dist
            packages/cli/dist
            packages/core/dist
            packages/analytics/dist

  # Post-publish: verify packages install correctly from npm with each package manager.
  # This runs AFTER publish — the packages must be on npm for transitive deps to resolve.
  # Failures here are alerts, not blockers (packages are already published).
  e2e-install:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build

      - name: E2E install test CLI
        run: pnpm --filter @vivero/stoma-cli test:e2e:install

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: stoma-dist
          path: packages

      - name: Build docs
        run: pnpm --filter @vivero/stoma-docs build

      - name: Deploy docs to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
